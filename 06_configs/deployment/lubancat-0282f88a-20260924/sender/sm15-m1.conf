[Service]
Environment="XIAOHUAN_RECORD_CARD_MATCH=SM15 M1 USB audio"
Environment="XIAOHUAN_PLAYBACK_CARD_MATCH=SM15 M1 USB audio"
Environment=XIAOHUAN_MIC_CAPTURE_LEVEL=100%
Environment=XIAOHUAN_MIC_AGC=off
Environment=XIAOHUAN_PCM_PLAYBACK_LEVEL=100%
# The SM15 AEC can intentionally emit exact digital silence. Do not treat that
# as a disconnected capture device; ALSA read failures still trigger recovery.
Environment=XIAOHUAN_ZERO_AUDIO_RESTART_SECONDS=0
