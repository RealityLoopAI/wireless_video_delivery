<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemini Monitor</title>
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1c1a16;
      --muted: #746b5f;
      --panel: rgba(255, 252, 244, 0.9);
      --line: #d7cab8;
      --accent: #006c67;
      --danger: #b2402a;
      --ok: #27733f;
      --warn: #b87900;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Aptos", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(0,108,103,.16), transparent 30rem),
        radial-gradient(circle at 88% 6%, rgba(178,64,42,.13), transparent 28rem),
        linear-gradient(135deg, #f9f3e5 0%, var(--bg) 58%, #e9dfce 100%);
    }
    header {
      padding: 24px clamp(16px, 4vw, 48px) 14px;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-end;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 48px);
      letter-spacing: -0.06em;
    }
    .sub {
      color: var(--muted);
      margin-top: 6px;
    }
    main {
      padding: 0 clamp(16px, 4vw, 48px) 42px;
    }
    .toolbar, .card, .debug-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 18px 60px rgba(44, 33, 21, .10);
      backdrop-filter: blur(12px);
      border-radius: 24px;
    }
    .toolbar {
      padding: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 17px;
      color: white;
      background: var(--accent);
      font-weight: 800;
      cursor: pointer;
    }
    button.stop { background: var(--danger); }
    button.secondary { background: #635a50; }
    .input-group {
      display: grid;
      gap: 5px;
      min-width: min(280px, 100%);
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }
    input {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 13px;
      color: var(--ink);
      background: rgba(255,255,255,.68);
      font: inherit;
      font-weight: 750;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,108,103,.12);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    .card {
      padding: clamp(14px, 2.5vw, 22px);
    }
    .camera-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 14px;
    }
    .key {
      margin-top: 7px;
      font-size: clamp(20px, 2.5vw, 30px);
      font-weight: 900;
      letter-spacing: -0.04em;
    }
    .camera-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .camera-name-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: end;
      margin-top: 10px;
    }
    .camera-name-row .input-group {
      min-width: min(340px, 100%);
    }
    .camera-edit-row {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto minmax(240px, 1fr) auto;
      gap: 8px;
      align-items: end;
      margin-top: 14px;
    }
    .camera-edit-row .input-group {
      min-width: 0;
    }
    .storage-key {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      word-break: break-all;
    }
    .save-path {
      margin-top: 10px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.42);
      color: var(--muted);
      word-break: break-all;
    }
    .save-path span {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .save-path strong {
      color: var(--ink);
      font-size: 15px;
    }
    .preview {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }
    .view {
      min-height: min(42vh, 440px);
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      background: #1c1a16;
      border: 1px solid rgba(28,26,22,.2);
      display: grid;
      place-items: center;
      position: relative;
    }
    .view img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .view span {
      color: #f9f3e5;
      padding: 14px;
      text-align: center;
      font-weight: 800;
    }
    .view::before {
      content: attr(data-title);
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 1;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      background: rgba(0,0,0,.48);
      padding: 5px 9px;
      border-radius: 999px;
    }
    .pill {
      display: inline-flex;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      margin-right: 6px;
    }
    .pill.ok { background: rgba(39,115,63,.12); color: var(--ok); }
    .pill.off { background: rgba(178,64,42,.12); color: var(--danger); }
    .pill.warn { background: rgba(184,121,0,.14); color: var(--warn); }
    .debug-panel {
      margin-top: 10px;
      padding: 12px 14px;
    }
    .card .debug-panel {
      box-shadow: none;
      background: rgba(255,255,255,.32);
    }
    summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 900;
      user-select: none;
    }
    .debug-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .debug-item {
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .value {
      font-size: 16px;
      font-weight: 850;
      word-break: break-all;
    }
    .empty {
      padding: 28px;
      text-align: center;
      color: var(--muted);
      font-weight: 800;
    }
    @media (max-width: 900px) {
      header {
        display: block;
      }
      .camera-head {
        display: block;
      }
      .camera-actions {
        justify-content: flex-start;
        margin-top: 12px;
      }
      .camera-edit-row {
        grid-template-columns: 1fr;
      }
      .preview {
        grid-template-columns: 1fr;
      }
      .view {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Gemini Monitor</h1>
      <div class="sub">日常画面监控与录制控制</div>
    </div>
    <div id="summary" class="sub">加载中...</div>
  </header>
  <main>
    <section class="toolbar">
      <button onclick="post('/api/record/start-all')">开始全部录制</button>
      <button class="stop" onclick="post('/api/record/stop-all')">停止全部录制</button>
      <button class="secondary" onclick="load()">刷新</button>
    </section>
    <section id="cards" class="grid"></section>
    <details class="debug-panel">
      <summary>高级状态</summary>
      <section id="system" class="debug-grid"></section>
    </details>
  </main>
  <script>
    const fmtBytes = (n) => {
      if (!Number.isFinite(n)) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let value = n;
      let idx = 0;
      while (value >= 1024 && idx < units.length - 1) {
        value /= 1024;
        idx += 1;
      }
      return `${value.toFixed(idx ? 1 : 0)} ${units[idx]}`;
    };
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch]));
    async function post(url) {
      const res = await fetch(url, {method: 'POST'});
      const text = await res.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch (_) { data = {raw: text}; }
      if (!res.ok || data.ok === false) alert(data.error || data.detail || text);
      await load();
      return data;
    }
    function currentCardPrefix(card) {
      const input = card.querySelector('[data-field="file_prefix_input"]');
      return input ? input.value || '' : '';
    }
    async function postCamera(path, sender, camera, card = null) {
      const params = new URLSearchParams({sender_id: sender, camera_id: camera});
      if (card) params.set('file_prefix', currentCardPrefix(card));
      await post(`${path}?${params.toString()}`);
    }
    function cardId(key) {
      return `camera-${key.replace(/[^a-zA-Z0-9_-]/g, '_')}`;
    }
    function setText(card, field, value) {
      const node = card.querySelector(`[data-field="${field}"]`);
      if (node) node.textContent = value;
    }
    function ensureCard(c) {
      const cards = document.getElementById('cards');
      const id = cardId(c.camera_key);
      let card = document.getElementById(id);
      if (card) return card;

      card = document.createElement('article');
      card.className = 'card';
      card.id = id;
      card.innerHTML = `
        <div class="camera-head">
          <div>
            <div data-field="pills"></div>
            <div class="key" data-field="camera_key"></div>
            <div class="storage-key">保存目录名：<span data-field="storage_key"></span></div>
          </div>
          <div class="camera-actions">
            <button data-action="start">单路开始</button>
            <button class="stop" data-action="stop">单路停止</button>
          </div>
        </div>
        <div class="preview">
          <div class="view" data-title="RGB">
            <img alt="RGB preview" data-preview="rgb" style="display:none">
            <span data-placeholder="rgb">等待 RGB 画面</span>
          </div>
          <div class="view" data-title="Depth 伪彩">
            <img alt="Depth preview" data-preview="depth" style="display:none">
            <span data-placeholder="depth">等待 Depth 画面</span>
          </div>
        </div>
        <div class="camera-edit-row">
          <label class="input-group">
            <span>相机自命名（留空则用原始 ID）</span>
            <input data-field="camera_name_input" placeholder="例如 front_left" />
          </label>
          <button class="secondary" data-action="save-name">保存命名</button>
          <label class="input-group">
            <span>本路文件名前缀（留空则不加）</span>
            <input data-field="file_prefix_input" placeholder="例如 cam01_" />
          </label>
          <button class="secondary" data-action="save-prefix">保存前缀</button>
        </div>
        <div class="save-path">
          <span>当前保存目录</span>
          <strong data-field="segment_dir"></strong>
        </div>
        <details class="debug-panel">
          <summary>高级状态</summary>
          <div class="debug-grid">
            <div class="debug-item"><div class="label">RGB packets</div><div class="value" data-field="rgb_packets"></div></div>
            <div class="debug-item"><div class="label">Depth packets</div><div class="value" data-field="depth_packets"></div></div>
            <div class="debug-item"><div class="label">RGB bytes</div><div class="value" data-field="rgb_bytes"></div></div>
            <div class="debug-item"><div class="label">Depth bytes</div><div class="value" data-field="depth_bytes"></div></div>
            <div class="debug-item"><div class="label">RGB preview</div><div class="value" data-field="rgb_preview"></div></div>
            <div class="debug-item"><div class="label">Depth preview</div><div class="value" data-field="depth_preview"></div></div>
            <div class="debug-item"><div class="label">Last media us</div><div class="value" data-field="last_media_us"></div></div>
            <div class="debug-item"><div class="label">Last error</div><div class="value" data-field="last_error"></div></div>
          </div>
        </details>`;
      card.querySelector('[data-action="start"]').addEventListener('click', () => {
        postCamera('/api/record/start', card.dataset.senderId, card.dataset.cameraId, card);
      });
      card.querySelector('[data-action="stop"]').addEventListener('click', () => {
        postCamera('/api/record/stop', card.dataset.senderId, card.dataset.cameraId);
      });
      card.querySelector('[data-action="save-name"]').addEventListener('click', () => {
        const input = card.querySelector('[data-field="camera_name_input"]');
        const params = new URLSearchParams({
          sender_id: card.dataset.senderId,
          camera_id: card.dataset.cameraId,
          camera_name: input.value || ''
        });
        post(`/api/camera/name?${params.toString()}`);
      });
      card.querySelector('[data-action="save-prefix"]').addEventListener('click', () => {
        const input = card.querySelector('[data-field="file_prefix_input"]');
        const params = new URLSearchParams({
          sender_id: card.dataset.senderId,
          camera_id: card.dataset.cameraId,
          prefix: input.value || ''
        });
        post(`/api/camera/prefix?${params.toString()}`);
      });
      cards.appendChild(card);
      return card;
    }
    function setPills(card, c) {
      const pills = card.querySelector('[data-field="pills"]');
      const live = c.live !== false && c.online;
      const rgbWarn = c.rgb_packets > 0 && c.rgb_bytes / c.rgb_packets < 1000
        ? '<span class="pill warn">RGB 异常</span>' : '';
      pills.innerHTML = `
        <span class="pill ${live ? 'ok' : 'off'}">${live ? '实时' : '非实时'}</span>
        <span class="pill ${c.recording ? 'ok' : 'off'}">${c.recording ? '录制中' : '空闲'}</span>
        ${rgbWarn}`;
    }
    function previewLabel(kind) {
      return kind === 'rgb' ? 'RGB' : 'Depth';
    }
    function nextPreviewToken(card, kind) {
      const key = `${kind}Token`;
      const token = String(Number(card.dataset[key] || '0') + 1);
      card.dataset[key] = token;
      return token;
    }
    function clearPreview(card, kind, message) {
      const img = card.querySelector(`[data-preview="${kind}"]`);
      const placeholder = card.querySelector(`[data-placeholder="${kind}"]`);
      nextPreviewToken(card, kind);
      card.dataset[`${kind}Loading`] = '0';
      img.removeAttribute('src');
      img.style.display = 'none';
      placeholder.textContent = message || `${previewLabel(kind)} 无实时画面`;
      placeholder.style.display = '';
    }
    function refreshPreview(card, kind, available, url) {
      const img = card.querySelector(`[data-preview="${kind}"]`);
      const placeholder = card.querySelector(`[data-placeholder="${kind}"]`);
      if (!available) {
        clearPreview(card, kind, `${previewLabel(kind)} 无实时画面`);
        return;
      }
      if (card.dataset[`${kind}Loading`] === '1') return;

      const next = new Image();
      const token = nextPreviewToken(card, kind);
      card.dataset[`${kind}Loading`] = '1';
      next.onload = () => {
        if (card.dataset[`${kind}Token`] !== token || card.dataset[`${kind}Available`] !== '1') {
          return;
        }
        img.src = next.src;
        img.style.display = 'block';
        placeholder.style.display = 'none';
        card.dataset[`${kind}Loading`] = '0';
      };
      next.onerror = () => {
        if (card.dataset[`${kind}Token`] === token) {
          clearPreview(card, kind, `${previewLabel(kind)} 暂无实时画面`);
          return;
        }
        card.dataset[`${kind}Loading`] = '0';
      };
      next.src = url;
    }
    function updateCard(c) {
      const card = ensureCard(c);
      card.dataset.senderId = c.sender_id;
      card.dataset.cameraId = c.camera_id;
      const live = c.live !== false && c.online;
      card.dataset.rgbAvailable = live && c.rgb_preview_available ? '1' : '0';
      card.dataset.depthAvailable = live && c.depth_preview_available ? '1' : '0';
      setPills(card, c);
      setText(card, 'camera_key', c.camera_key);
      setText(card, 'storage_key', c.storage_key || c.camera_key);
      const nameInput = card.querySelector('[data-field="camera_name_input"]');
      if (nameInput && document.activeElement !== nameInput) {
        nameInput.value = c.camera_name || '';
      }
      const prefixInput = card.querySelector('[data-field="file_prefix_input"]');
      if (prefixInput && document.activeElement !== prefixInput) {
        prefixInput.value = c.camera_file_prefix || '';
      }
      setText(card, 'segment_dir', c.segment_dir || '未开启录制');
      setText(card, 'rgb_packets', c.rgb_packets);
      setText(card, 'depth_packets', c.depth_packets);
      setText(card, 'rgb_bytes', fmtBytes(c.rgb_bytes));
      setText(card, 'depth_bytes', fmtBytes(c.depth_bytes));
      setText(card, 'rgb_preview', `${c.rgb_preview_width || 0}x${c.rgb_preview_height || 0}`);
      setText(card, 'depth_preview', `${c.depth_preview_width || 0}x${c.depth_preview_height || 0}`);
      setText(card, 'last_media_us', c.last_media_us);
      setText(card, 'last_error', c.last_error || '无');

      refreshCardPreviews(card);
    }
    function previewUrl(card, kind) {
      return `/api/preview/${kind}?sender_id=${encodeURIComponent(card.dataset.senderId)}&camera_id=${encodeURIComponent(card.dataset.cameraId)}&t=${Date.now()}`;
    }
    function refreshCardPreviews(card) {
      if (!card.dataset.senderId || !card.dataset.cameraId) return;
      refreshPreview(card, 'rgb', card.dataset.rgbAvailable === '1', previewUrl(card, 'rgb'));
      refreshPreview(card, 'depth', card.dataset.depthAvailable === '1', previewUrl(card, 'depth'));
    }
    function refreshAllPreviews() {
      document.querySelectorAll('.card[id^="camera-"]').forEach(refreshCardPreviews);
    }
    async function load() {
      const res = await fetch('/api/status');
      const data = await res.json();
      const online = data.cameras.filter((c) => c.live !== false && c.online).length;
      const recording = data.cameras.filter((c) => c.recording).length;
      document.getElementById('summary').textContent =
        `${online}/${data.cameras.length} 在线 · ${recording ? `${recording} 路录制中` : '空闲'}`;
      document.getElementById('system').innerHTML = `
        <div class="debug-item"><div class="label">媒体端口</div><div class="value">TCP ${data.media_port}</div></div>
        <div class="debug-item"><div class="label">状态端口</div><div class="value">UDP ${data.status_port}</div></div>
        <div class="debug-item"><div class="label">管理端口</div><div class="value">HTTP ${data.admin_port}</div></div>
        <div class="debug-item"><div class="label">NAS</div><div class="value">${escapeHtml(data.nas_root)}</div></div>
        <div class="debug-item"><div class="label">全局录制</div><div class="value">${data.recording_all ? '开启' : '关闭'}</div></div>`;
      const cards = document.getElementById('cards');
      cards.querySelector('[data-empty="true"]')?.remove();
      const seen = new Set(data.cameras.map((c) => cardId(c.camera_key)));
      for (const card of [...cards.querySelectorAll('.card[id^="camera-"]')]) {
        if (!seen.has(card.id)) card.remove();
      }
      if (data.cameras.length) {
        data.cameras.forEach(updateCard);
      } else if (!cards.querySelector('[data-empty="true"]')) {
        cards.innerHTML = '<article class="card empty" data-empty="true">等待发送端连接</article>';
      }
    }
    load();
    setInterval(load, 1000);
    setInterval(refreshAllPreviews, 25);
  </script>
</body>
</html>
