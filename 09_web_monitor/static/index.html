<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemini Monitor</title>
  <style>
    :root {
      --bg: #070b0b;
      --panel: rgba(15, 21, 20, .88);
      --panel-soft: rgba(255, 255, 255, .055);
      --ink: #eef5ee;
      --muted: #93a39a;
      --line: rgba(218, 232, 221, .17);
      --accent: #25c4ad;
      --danger: #d75b44;
      --ok: #55d87c;
      --warn: #e0ad42;
      --shadow: rgba(0, 0, 0, .42);
      --header-h: 38px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      color: var(--ink);
      font-family: "Aptos", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% -10%, rgba(37, 196, 173, .18), transparent 32rem),
        radial-gradient(circle at 92% 2%, rgba(215, 91, 68, .11), transparent 28rem),
        linear-gradient(135deg, #050707 0%, #0b1110 55%, #121817 100%);
    }
    header {
      height: var(--header-h);
      padding: 4px clamp(8px, 1.2vw, 14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(5, 7, 7, .78);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    h1 {
      margin: 0;
      font-size: clamp(15px, 1.6vw, 21px);
      letter-spacing: -.04em;
      white-space: nowrap;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .summary {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 5px 9px;
      color: #03110f;
      background: var(--accent);
      font: inherit;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }
    button.stop { background: var(--danger); color: #fff; }
    button.secondary { background: #53615b; color: #fff; }
    button.ghost {
      color: var(--ink);
      background: rgba(255, 255, 255, .08);
      border: 1px solid var(--line);
    }
    button.active {
      color: #03110f;
      background: var(--accent);
    }
    main {
      height: calc(100vh - var(--header-h));
      padding: 8px;
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      gap: 8px;
      overflow: hidden;
    }
    .main-stage,
    .side-rail {
      min-height: 0;
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 52px var(--shadow);
      backdrop-filter: blur(16px);
    }
    .main-stage {
      padding: 8px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 7px;
    }
    .stage-head,
    .side-head {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 24px;
    }
    .stage-kicker {
      color: var(--muted);
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .12em;
    }
    .stage-title-block {
      min-width: 0;
    }
    .stage-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 950;
    }
    .stage-meta {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }
    .main-dual {
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }
    .main-pane,
    .thumb-view {
      position: relative;
      min-height: 0;
      display: block;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid rgba(238, 245, 238, .14);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .045), transparent 35%),
        #020505;
    }
    .main-pane {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      align-self: center;
      justify-self: center;
      background: #000;
    }
    .main-pane::before,
    .thumb-view::before {
      content: attr(data-title);
      position: absolute;
      left: 7px;
      top: 6px;
      z-index: 1;
      padding: 3px 7px;
      border-radius: 999px;
      color: var(--ink);
      background: rgba(0, 0, 0, .55);
      font-size: 9px;
      font-weight: 950;
      letter-spacing: .02em;
    }
    .main-pane img,
    .thumb-view img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
    }
    .main-pane img {
      object-fit: contain !important;
    }
    .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #dfe9df;
      padding: 16px;
      text-align: center;
      font-weight: 900;
    }
    .side-rail {
      padding: 7px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 7px;
      overflow: hidden;
    }
    .thumb-list {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(var(--side-count, 1), minmax(0, 1fr));
      gap: 6px;
    }
    .thumb-card {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 4px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255, 255, 255, .045);
      cursor: pointer;
      overflow: hidden;
    }
    .thumb-card.active {
      border-color: rgba(37, 196, 173, .72);
      box-shadow: inset 0 0 0 1px rgba(37, 196, 173, .35), 0 0 0 1px rgba(37, 196, 173, .16);
    }
    .thumb-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-width: 0;
      height: 16px;
    }
    .thumb-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
      font-weight: 900;
    }
    .thumb-state {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      white-space: nowrap;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
    }
    .dot.ok { background: var(--ok); }
    .dot.recording { background: var(--warn); }
    .thumb-preview {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
    }
    .thumb-view {
      position: relative;
      min-height: 0;
      overflow: hidden;
      display: block;
      border-radius: 9px;
      border: 1px solid rgba(238, 245, 238, .12);
      background: #020505;
    }
    .thumb-view::before { left: 5px; top: 4px; padding: 2px 5px; font-size: 8px; }
    .thumb-view span {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      text-align: center;
      padding: 6px;
    }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      background: rgba(0, 0, 0, .36);
      transition: opacity .16s ease;
    }
    .settings-drawer {
      position: fixed;
      z-index: 31;
      left: 8px;
      right: 8px;
      bottom: 8px;
      max-height: min(62vh, 620px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      padding: 12px;
      color: var(--ink);
      background: rgba(12, 17, 16, .96);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 -24px 80px rgba(0, 0, 0, .45);
      transform: translateY(calc(100% + 16px));
      transition: transform .18s ease;
    }
    body.drawer-open .drawer-backdrop {
      pointer-events: auto;
      opacity: 1;
    }
    body.drawer-open .settings-drawer {
      transform: translateY(0);
    }
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .drawer-title {
      font-size: 18px;
      font-weight: 950;
    }
    .settings-body {
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }
    .setting-card {
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--panel-soft);
    }
    .setting-title {
      font-size: 14px;
      font-weight: 950;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .setting-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
    }
    .input-group {
      display: grid;
      gap: 4px;
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 11px;
      color: var(--ink);
      background: rgba(255, 255, 255, .08);
      font: inherit;
      font-size: 12px;
      font-weight: 750;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 196, 173, .16);
    }
    .info-block {
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, .04);
      word-break: break-all;
    }
    .info-block span,
    .debug-label {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
    }
    .info-block strong,
    .debug-value {
      color: var(--ink);
      font-size: 12px;
      font-weight: 850;
      word-break: break-all;
    }
    details {
      margin-top: 8px;
    }
    summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      user-select: none;
    }
    .debug-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .debug-item {
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }
    .empty {
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-weight: 900;
      text-align: center;
    }
    @media (max-width: 900px) {
      body {
        height: auto;
        overflow: auto;
      }
      header {
        height: auto;
        flex-wrap: wrap;
      }
      main {
        height: auto;
        grid-template-columns: 1fr;
        overflow: visible;
      }
      .main-stage {
        height: 70vh;
        min-height: 320px;
      }
      .side-rail {
        height: 42vh;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Gemini Monitor</h1>
    <div class="topbar">
      <div id="summary" class="summary">加载中...</div>
      <button onclick="post('/api/record/start-all')">开始</button>
      <button class="stop" onclick="post('/api/record/stop-all')">停止</button>
      <button class="secondary" onclick="load()">刷新</button>
      <button class="ghost" onclick="openSettings()">设置</button>
    </div>
  </header>

  <main>
    <section class="main-stage">
      <div class="stage-head">
        <div class="stage-title-block">
          <div class="stage-kicker">Main Camera</div>
          <div id="mainTitle" class="stage-name">等待主画面</div>
        </div>
        <div id="mainState" class="stage-meta"><span class="dot"></span><span>WAIT</span></div>
      </div>
      <div class="main-dual">
        <div id="mainRgbPane" class="main-pane" data-title="RGB">
          <img alt="主 RGB 预览" data-preview="rgb" style="display:none" />
          <span data-placeholder="rgb" class="placeholder">等待 RGB</span>
        </div>
        <div id="mainDepthPane" class="main-pane" data-title="Depth">
          <img alt="主 Depth 预览" data-preview="depth" style="display:none" />
          <span data-placeholder="depth" class="placeholder">等待 Depth</span>
        </div>
      </div>
    </section>

    <aside class="side-rail">
      <div class="side-head">
        <div>
          <div class="stage-kicker">Other Cameras</div>
          <div class="stage-name">其他画面</div>
        </div>
        <div id="sideSummary" class="stage-meta">0 路</div>
      </div>
      <section id="thumbs" class="thumb-list"></section>
    </aside>
  </main>

  <div id="drawerBackdrop" class="drawer-backdrop" onclick="closeSettings()"></div>
  <aside id="settingsDrawer" class="settings-drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="drawer-title">设置 / 状态</div>
      <button class="ghost" onclick="closeSettings()">关闭</button>
    </div>
    <div class="settings-body">
      <section id="settingsList"></section>
      <details>
        <summary>系统状态</summary>
        <section id="system" class="debug-grid"></section>
      </details>
    </div>
  </aside>

  <script>
    let cameras = [];
    let visibleCameras = [];
    let sideCameras = [];
    let mainKey = '';
    let mainTargetSyncKey = '';
    let loopsStarted = false;

    const STATUS_REFRESH_MS = 1000;
    const MAIN_RGB_REFRESH_MS = 33;
    const MAIN_DEPTH_REFRESH_MS = 180;
    const THUMB_DEPTH_REFRESH_MS = 650;
    const HIDDEN_REFRESH_MS = 1000;
    const ENABLE_THUMB_RGB_PREVIEW = true;

    const fmtBytes = (n) => {
      if (!Number.isFinite(n)) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let value = n;
      let idx = 0;
      while (value >= 1024 && idx < units.length - 1) {
        value /= 1024;
        idx += 1;
      }
      return `${value.toFixed(idx ? 1 : 0)} ${units[idx]}`;
    };
    const pad2 = (value) => String(value).padStart(2, '0');
    const formatBeijingDate = (date) => {
      const beijing = new Date(date.getTime() + 8 * 60 * 60 * 1000);
      return `${beijing.getUTCFullYear()}-${pad2(beijing.getUTCMonth() + 1)}-${pad2(beijing.getUTCDate())} ` +
        `${pad2(beijing.getUTCHours())}:${pad2(beijing.getUTCMinutes())}:${pad2(beijing.getUTCSeconds())}`;
    };
    const formatBeijingUs = (value) => {
      const us = Number(value);
      if (!Number.isFinite(us) || us <= 0) return '无';
      return formatBeijingDate(new Date(Math.floor(us / 1000)));
    };
    const formatAgeSeconds = (value) => {
      const ms = Number(value);
      if (!Number.isFinite(ms) || ms < 0) return '';
      return `${Math.round(ms / 1000)} 秒前`;
    };
    const formatBeijingUsWithAge = (timestampUs, ageMs) => {
      const timeText = formatBeijingUs(timestampUs);
      const ageText = formatAgeSeconds(ageMs);
      return ageText ? `${timeText} (${ageText})` : timeText;
    };
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch]));
    const displayName = (c) => c?.camera_name || c?.storage_key || c?.camera_key || '未知相机';
    const isLive = (c) => c && c.live !== false && c.online;

    async function post(url) {
      const res = await fetch(url, {method: 'POST'});
      const text = await res.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch (_) { data = {raw: text}; }
      if (!res.ok || data.ok === false) alert(data.error || data.detail || text);
      await load();
      return data;
    }
    function openSettings() {
      document.body.classList.add('drawer-open');
      document.getElementById('settingsDrawer').setAttribute('aria-hidden', 'false');
    }
    function closeSettings() {
      document.body.classList.remove('drawer-open');
      document.getElementById('settingsDrawer').setAttribute('aria-hidden', 'true');
    }
    function cardId(prefix, key) {
      return `${prefix}-${key.replace(/[^a-zA-Z0-9_-]/g, '_')}`;
    }
    function setText(root, field, value) {
      const node = root.querySelector(`[data-field="${field}"]`);
      if (node) node.textContent = value;
    }
    function chooseMainCamera() {
      if (mainKey && visibleCameras.some((c) => c.camera_key === mainKey)) return;
      mainKey = (visibleCameras[0] || {}).camera_key || '';
      mainTargetSyncKey = '';
    }
    function selectMainCamera(key) {
      if (!key) return;
      mainKey = key;
      mainTargetSyncKey = '';
      renderCameraPanels();
      clearMainPreview();
      refreshMainPreview();
    }
    function syncMainTarget() {
      const c = cameras.find((item) => item.camera_key === mainKey);
      if (!c || mainTargetSyncKey === mainKey) return;
      mainTargetSyncKey = mainKey;
      const params = new URLSearchParams({sender_id: c.sender_id, camera_id: c.camera_id});
      fetch(`/api/preview/main-target?${params.toString()}`, {method: 'POST'}).catch(() => {
        if (mainTargetSyncKey === mainKey) mainTargetSyncKey = '';
      });
    }
    function previewUrl(c, kind, high = false) {
      const endpoint = high && kind === 'rgb' ? 'rgb-main' : kind;
      return `/api/preview/${endpoint}?sender_id=${encodeURIComponent(c.sender_id)}&camera_id=${encodeURIComponent(c.camera_id)}&t=${Date.now()}`;
    }
    function previewAvailable(c, kind, high = false) {
      if (!isLive(c)) return false;
      if (kind === 'rgb') {
        return high ? (c.main_rgb_preview_available || c.rgb_preview_available || c.rgb_packets > 0) : (c.rgb_preview_available || c.rgb_packets > 0);
      }
      return c.depth_preview_available;
    }
    function hasAnyPreview(c) {
      return isLive(c) && (previewAvailable(c, 'rgb') || previewAvailable(c, 'depth') || c.rgb_packets > 0 || c.depth_packets > 0);
    }
    function clearMainPreview(message = '等待主画面') {
      clearPreview(document.getElementById('mainRgbPane'), 'rgb', message === '等待主画面' ? '等待 RGB' : message);
      clearPreview(document.getElementById('mainDepthPane'), 'depth', message === '等待主画面' ? '等待 Depth' : message);
    }
    function updateMainHeader(c) {
      const title = document.getElementById('mainTitle');
      const state = document.getElementById('mainState');
      if (!c) {
        title.textContent = cameras.length ? '等待实时画面' : '等待发送端连接';
        state.innerHTML = '<span class="dot"></span><span>WAIT</span>';
        return;
      }
      title.textContent = displayName(c);
      const status = c.recording ? 'REC' : (isLive(c) ? 'LIVE' : 'OFF');
      const dotClass = c.recording ? 'recording' : (isLive(c) ? 'ok' : '');
      const rgb = `${c.main_rgb_preview_width || c.rgb_preview_width || 0}x${c.main_rgb_preview_height || c.rgb_preview_height || 0}`;
      const depth = `${c.depth_preview_width || 0}x${c.depth_preview_height || 0}`;
      state.innerHTML = `<span class="dot ${dotClass}"></span><span>${status}</span><span>RGB ${rgb}</span><span>DEPTH ${depth}</span>`;
    }
    function refreshMainPreview() {
      const c = cameras.find((item) => item.camera_key === mainKey);
      if (!c) {
        clearMainPreview(cameras.length ? '等待实时画面' : '等待发送端连接');
        return;
      }
      syncMainTarget();
      refreshPreview(document.getElementById('mainRgbPane'), c, 'rgb', true);
      refreshPreview(document.getElementById('mainDepthPane'), c, 'depth', false);
    }
    function refreshMainPreviewKind(kind) {
      const c = cameras.find((item) => item.camera_key === mainKey);
      if (!c) {
        if (kind === 'rgb') {
          clearPreview(document.getElementById('mainRgbPane'), 'rgb', cameras.length ? '等待实时画面' : '等待发送端连接');
        }
        else {
          clearPreview(document.getElementById('mainDepthPane'), 'depth', cameras.length ? '等待实时画面' : '等待发送端连接');
        }
        return;
      }
      syncMainTarget();
      refreshPreview(kind === 'rgb' ? document.getElementById('mainRgbPane') : document.getElementById('mainDepthPane'), c, kind, kind === 'rgb');
    }
    function ensureThumb(c) {
      const thumbs = document.getElementById('thumbs');
      const id = cardId('thumb', c.camera_key);
      let card = document.getElementById(id);
      if (card) return card;
      card = document.createElement('article');
      card.className = 'thumb-card';
      card.id = id;
      card.innerHTML = `
        <div class="thumb-head">
          <div class="thumb-name" data-field="name"></div>
          <div class="thumb-state"><span class="dot" data-field="live_dot"></span><span data-field="state"></span></div>
        </div>
        <div class="thumb-preview">
          <div class="thumb-view" data-title="RGB">
            <img alt="RGB preview" data-preview="rgb" style="display:none">
            <span data-placeholder="rgb">RGB</span>
          </div>
          <div class="thumb-view" data-title="Depth">
            <img alt="Depth preview" data-preview="depth" style="display:none">
            <span data-placeholder="depth">Depth</span>
          </div>
        </div>`;
      card.addEventListener('click', () => selectMainCamera(card.dataset.cameraKey));
      thumbs.appendChild(card);
      return card;
    }
    function updateThumb(c) {
      const card = ensureThumb(c);
      card.dataset.cameraKey = c.camera_key;
      card.dataset.senderId = c.sender_id;
      card.dataset.cameraId = c.camera_id;
      card.dataset.rgbAvailable = previewAvailable(c, 'rgb') ? '1' : '0';
      card.dataset.depthAvailable = previewAvailable(c, 'depth') ? '1' : '0';
      setText(card, 'name', displayName(c));
      setText(card, 'state', c.recording ? 'REC' : (isLive(c) ? 'LIVE' : 'OFF'));
      const dot = card.querySelector('[data-field="live_dot"]');
      dot.className = `dot ${c.recording ? 'recording' : (isLive(c) ? 'ok' : '')}`;
      card.classList.toggle('active', c.camera_key === mainKey);
    }
    function clearPreview(root, kind, message) {
      const img = root.querySelector(`[data-preview="${kind}"]`);
      const placeholder = root.querySelector(`[data-placeholder="${kind}"]`);
      root.dataset[`${kind}Token`] = String(Number(root.dataset[`${kind}Token`] || '0') + 1);
      root.dataset[`${kind}Loading`] = '0';
      img.removeAttribute('src');
      img.style.display = 'none';
      placeholder.textContent = message || kind;
      placeholder.style.display = '';
    }
    function refreshPreview(root, c, kind, high = false) {
      const img = root.querySelector(`[data-preview="${kind}"]`);
      const placeholder = root.querySelector(`[data-placeholder="${kind}"]`);
      if (!previewAvailable(c, kind, high)) {
        if (isLive(c) && img.getAttribute('src')) {
          placeholder.style.display = 'none';
          return;
        }
        clearPreview(root, kind, kind === 'rgb' ? 'RGB' : 'Depth');
        return;
      }
      if (root.dataset[`${kind}Loading`] === '1') return;
      const token = String(Number(root.dataset[`${kind}Token`] || '0') + 1);
      root.dataset[`${kind}Token`] = token;
      root.dataset[`${kind}Loading`] = '1';
      const next = new Image();
      next.onload = () => {
        if (root.dataset[`${kind}Token`] !== token) return;
        img.src = next.src;
        img.style.display = 'block';
        placeholder.style.display = 'none';
        root.dataset[`${kind}Loading`] = '0';
      };
      next.onerror = () => {
        if (root.dataset[`${kind}Token`] === token) {
          root.dataset[`${kind}Loading`] = '0';
          if (!img.getAttribute('src')) {
            clearPreview(root, kind, kind === 'rgb' ? 'RGB' : 'Depth');
          }
          else {
            placeholder.style.display = 'none';
          }
        }
      };
      next.src = previewUrl(c, kind, high);
    }
    function refreshAllThumbPreviews() {
      sideCameras.forEach((c) => {
        const card = document.getElementById(cardId('thumb', c.camera_key));
        if (!card) return;
        if (ENABLE_THUMB_RGB_PREVIEW) {
          refreshPreview(card, c, 'rgb');
        }
        else {
          clearPreview(card, 'rgb', 'RGB');
        }
        refreshPreview(card, c, 'depth');
      });
    }
    function refreshThumbPreviews(kind) {
      sideCameras.forEach((c) => {
        const card = document.getElementById(cardId('thumb', c.camera_key));
        if (!card) return;
        if (kind === 'rgb' && !ENABLE_THUMB_RGB_PREVIEW) {
          clearPreview(card, 'rgb', 'RGB');
          return;
        }
        refreshPreview(card, c, kind);
      });
    }
    function renderCameraPanels() {
      sideCameras = visibleCameras.filter((c) => c.camera_key !== mainKey);
      const mainCamera = cameras.find((c) => c.camera_key === mainKey);
      const thumbs = document.getElementById('thumbs');
      thumbs.style.setProperty('--side-count', String(Math.max(sideCameras.length, 1)));
      document.getElementById('sideSummary').textContent = `${sideCameras.length} 路`;
      updateMainHeader(mainCamera);
      syncDomList('thumbs', 'thumb', sideCameras);
      if (!sideCameras.length) {
        thumbs.innerHTML = `<div class="empty">${visibleCameras.length ? '没有其他实时画面' : '等待实时画面'}</div>`;
      }
      else {
        thumbs.querySelector('.empty')?.remove();
        sideCameras.forEach((c) => updateThumb(c));
      }
    }
    function ensureSetting(c) {
      const list = document.getElementById('settingsList');
      const id = cardId('setting', c.camera_key);
      let card = document.getElementById(id);
      if (card) return card;
      card = document.createElement('article');
      card.className = 'setting-card';
      card.id = id;
      card.innerHTML = `
        <div class="setting-title" data-field="title"></div>
        <div class="setting-grid">
          <label class="input-group">
            <span>相机自命名</span>
            <input data-field="camera_name_input" placeholder="留空则使用原始 ID">
          </label>
          <button class="secondary" data-action="save-name">保存</button>
          <label class="input-group">
            <span>本路文件名前缀</span>
            <input data-field="file_prefix_input" placeholder="留空则不加">
          </label>
          <button class="secondary" data-action="save-prefix">保存</button>
        </div>
        <div class="info-block"><span>当前保存目录</span><strong data-field="segment_dir"></strong></div>
        <div class="info-block"><span>保存目录名</span><strong data-field="storage_key"></strong></div>
        <details>
          <summary>详细状态</summary>
          <div class="debug-grid">
            <div class="debug-item"><span class="debug-label">RGB packets</span><div class="debug-value" data-field="rgb_packets"></div></div>
            <div class="debug-item"><span class="debug-label">Depth packets</span><div class="debug-value" data-field="depth_packets"></div></div>
            <div class="debug-item"><span class="debug-label">RGB bytes</span><div class="debug-value" data-field="rgb_bytes"></div></div>
            <div class="debug-item"><span class="debug-label">Depth bytes</span><div class="debug-value" data-field="depth_bytes"></div></div>
            <div class="debug-item"><span class="debug-label">RGB preview</span><div class="debug-value" data-field="rgb_preview"></div></div>
            <div class="debug-item"><span class="debug-label">Depth preview</span><div class="debug-value" data-field="depth_preview"></div></div>
            <div class="debug-item"><span class="debug-label">Last media</span><div class="debug-value" data-field="last_media_time"></div></div>
            <div class="debug-item"><span class="debug-label">Last status</span><div class="debug-value" data-field="last_status_time"></div></div>
            <div class="debug-item"><span class="debug-label">Last error</span><div class="debug-value" data-field="last_error"></div></div>
          </div>
        </details>`;
      card.querySelector('[data-action="save-name"]').addEventListener('click', () => {
        const input = card.querySelector('[data-field="camera_name_input"]');
        const params = new URLSearchParams({
          sender_id: card.dataset.senderId,
          camera_id: card.dataset.cameraId,
          camera_name: input.value || ''
        });
        post(`/api/camera/name?${params.toString()}`);
      });
      card.querySelector('[data-action="save-prefix"]').addEventListener('click', () => {
        const input = card.querySelector('[data-field="file_prefix_input"]');
        const params = new URLSearchParams({
          sender_id: card.dataset.senderId,
          camera_id: card.dataset.cameraId,
          prefix: input.value || ''
        });
        post(`/api/camera/prefix?${params.toString()}`);
      });
      list.appendChild(card);
      return card;
    }
    function updateSetting(c) {
      const card = ensureSetting(c);
      card.dataset.senderId = c.sender_id;
      card.dataset.cameraId = c.camera_id;
      setText(card, 'title', `${displayName(c)} · ${c.camera_key}`);
      setText(card, 'segment_dir', c.segment_dir || '未开启录制');
      setText(card, 'storage_key', c.storage_key || c.camera_key);
      setText(card, 'rgb_packets', c.rgb_packets);
      setText(card, 'depth_packets', c.depth_packets);
      setText(card, 'rgb_bytes', fmtBytes(c.rgb_bytes));
      setText(card, 'depth_bytes', fmtBytes(c.depth_bytes));
      setText(card, 'rgb_preview', `${c.rgb_preview_width || 0}x${c.rgb_preview_height || 0}`);
      setText(card, 'depth_preview', `${c.depth_preview_width || 0}x${c.depth_preview_height || 0}`);
      setText(card, 'last_media_time', formatBeijingUsWithAge(c.last_media_us, c.media_age_ms));
      setText(card, 'last_status_time', formatBeijingUsWithAge(c.last_status_us, c.status_age_ms));
      setText(card, 'last_error', c.last_error || '无');
      const nameInput = card.querySelector('[data-field="camera_name_input"]');
      if (nameInput && document.activeElement !== nameInput) nameInput.value = c.camera_name || '';
      const prefixInput = card.querySelector('[data-field="file_prefix_input"]');
      if (prefixInput && document.activeElement !== prefixInput) prefixInput.value = c.camera_file_prefix || '';
    }
    function syncDomList(containerId, prefix, items) {
      const liveIds = new Set(items.map((c) => cardId(prefix, c.camera_key)));
      document.querySelectorAll(`#${containerId} > [id^="${prefix}-"]`).forEach((node) => {
        if (!liveIds.has(node.id)) node.remove();
      });
    }
    async function load() {
      const res = await fetch('/api/status');
      const data = await res.json();
      cameras = data.cameras || [];
      visibleCameras = cameras.filter(hasAnyPreview);
      if (!mainKey && data.main_preview_camera_key && visibleCameras.some((c) => c.camera_key === data.main_preview_camera_key)) {
        mainKey = data.main_preview_camera_key;
      }
      chooseMainCamera();

      const online = cameras.filter(isLive).length;
      const recording = cameras.filter((c) => c.recording).length;
      const visible = visibleCameras.length;
      document.getElementById('summary').textContent =
        `${visible}/${cameras.length} 有画面 · ${online} 在线 · ${recording ? `${recording} 路录制` : '空闲'}`;
      document.getElementById('system').innerHTML = `
        <div class="debug-item"><span class="debug-label">系统时间</span><div class="debug-value">${formatBeijingDate(new Date())}</div></div>
        <div class="debug-item"><span class="debug-label">时区</span><div class="debug-value">北京时间 UTC+8</div></div>
        <div class="debug-item"><span class="debug-label">媒体端口</span><div class="debug-value">TCP ${data.media_port}</div></div>
        <div class="debug-item"><span class="debug-label">状态端口</span><div class="debug-value">UDP ${data.status_port}</div></div>
        <div class="debug-item"><span class="debug-label">管理端口</span><div class="debug-value">HTTP ${data.admin_port}</div></div>
        <div class="debug-item"><span class="debug-label">NAS</span><div class="debug-value">${escapeHtml(data.nas_root)}</div></div>
        <div class="debug-item"><span class="debug-label">全局录制</span><div class="debug-value">${data.recording_all ? '开启' : '关闭'}</div></div>`;

      syncDomList('settingsList', 'setting', cameras);
      if (!visibleCameras.length) {
        clearMainPreview(cameras.length ? '等待实时画面' : '等待发送端连接');
      }
      renderCameraPanels();
      if (!cameras.length) {
        document.getElementById('settingsList').innerHTML = '<div class="empty">暂无相机</div>';
        return;
      }
      document.getElementById('settingsList').querySelector('.empty')?.remove();
      cameras.forEach((c) => {
        updateSetting(c);
      });
      refreshMainPreview();
    }

    function loopStatus() {
      load().finally(() => {
        setTimeout(loopStatus, document.hidden ? HIDDEN_REFRESH_MS : STATUS_REFRESH_MS);
      });
    }
    function loopMainRgb() {
      if (!document.hidden) {
        refreshMainPreviewKind('rgb');
      }
      setTimeout(loopMainRgb, document.hidden ? HIDDEN_REFRESH_MS : MAIN_RGB_REFRESH_MS);
    }
    function loopMainDepth() {
      if (!document.hidden) {
        refreshMainPreviewKind('depth');
      }
      setTimeout(loopMainDepth, document.hidden ? HIDDEN_REFRESH_MS : MAIN_DEPTH_REFRESH_MS);
    }
    function loopThumbRgb() {
      if (!document.hidden) {
        refreshThumbPreviews('rgb');
      }
      setTimeout(loopThumbRgb, HIDDEN_REFRESH_MS);
    }
    function loopThumbDepth() {
      if (!document.hidden) {
        refreshThumbPreviews('depth');
      }
      setTimeout(loopThumbDepth, document.hidden ? HIDDEN_REFRESH_MS : THUMB_DEPTH_REFRESH_MS);
    }
    function startLoops() {
      if (loopsStarted) return;
      loopsStarted = true;
      loopStatus();
      loopMainRgb();
      loopMainDepth();
      loopThumbRgb();
      loopThumbDepth();
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        load();
        refreshMainPreview();
        refreshAllThumbPreviews();
      }
    });

    startLoops();
  </script>
</body>
</html>
