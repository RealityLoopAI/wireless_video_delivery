<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemini Wireless Video v3</title>
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1c1a16;
      --muted: #746b5f;
      --panel: rgba(255, 252, 244, 0.86);
      --line: #d7cab8;
      --accent: #006c67;
      --danger: #b2402a;
      --ok: #27733f;
      --warn: #b87900;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Aptos", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(0,108,103,.18), transparent 30rem),
        radial-gradient(circle at 90% 5%, rgba(178,64,42,.16), transparent 26rem),
        linear-gradient(135deg, #f9f3e5 0%, var(--bg) 55%, #e9dfce 100%);
    }
    header {
      padding: 32px clamp(18px, 4vw, 56px) 18px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-end;
    }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 56px); letter-spacing: -0.06em; }
    .sub { color: var(--muted); margin-top: 8px; }
    main { padding: 0 clamp(18px, 4vw, 56px) 48px; }
    .toolbar, .card, .strip {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 18px 60px rgba(44, 33, 21, .10);
      backdrop-filter: blur(12px);
      border-radius: 24px;
    }
    .toolbar { padding: 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 18px; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 17px;
      color: white;
      background: var(--accent);
      font-weight: 700;
      cursor: pointer;
    }
    button.stop { background: var(--danger); }
    button.secondary { background: #635a50; }
    .strip { padding: 14px 18px; margin-bottom: 18px; display: flex; gap: 18px; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
    .card { padding: 20px; }
    .key { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 4px; word-break: break-all; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 18px; }
    .preview { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
    .view {
      min-height: 180px;
      border-radius: 18px;
      overflow: hidden;
      background: #1c1a16;
      border: 1px solid rgba(28,26,22,.2);
      display: grid;
      place-items: center;
      position: relative;
    }
    .view img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .view span { color: #f9f3e5; padding: 14px; text-align: center; font-weight: 700; }
    .view::before {
      content: attr(data-title);
      position: absolute;
      left: 10px;
      top: 10px;
      z-index: 1;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      background: rgba(0,0,0,.44);
      padding: 5px 8px;
      border-radius: 999px;
    }
    .stat { border-top: 1px solid var(--line); padding-top: 10px; }
    .label { color: var(--muted); font-size: 12px; }
    .value { font-size: 18px; font-weight: 800; }
    .pill { display: inline-flex; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; margin-right: 6px; }
    .pill.ok { background: rgba(39,115,63,.12); color: var(--ok); }
    .pill.off { background: rgba(178,64,42,.12); color: var(--danger); }
    .pill.warn { background: rgba(184,121,0,.14); color: var(--warn); }
    pre { white-space: pre-wrap; word-break: break-word; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Gemini v3 Monitor</h1>
      <div class="sub">接收端实时状态、录制控制和 NAS 写入监控</div>
    </div>
    <div id="summary" class="sub">加载中...</div>
  </header>
  <main>
    <section class="toolbar">
      <button onclick="post('/api/record/start-all')">全局开始录制</button>
      <button class="stop" onclick="post('/api/record/stop-all')">全局停止录制</button>
      <button class="secondary" onclick="load()">刷新</button>
    </section>
    <section id="system" class="strip"></section>
    <section id="cards" class="grid"></section>
  </main>
  <script>
    const fmtBytes = (n) => {
      if (!Number.isFinite(n)) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let value = n;
      let idx = 0;
      while (value >= 1024 && idx < units.length - 1) {
        value /= 1024;
        idx += 1;
      }
      return `${value.toFixed(idx ? 1 : 0)} ${units[idx]}`;
    };
    async function post(url) {
      const res = await fetch(url, {method: 'POST'});
      if (!res.ok) alert(await res.text());
      await load();
    }
    async function postCamera(path, sender, camera) {
      await post(`${path}?sender_id=${encodeURIComponent(sender)}&camera_id=${encodeURIComponent(camera)}`);
    }
    function cardId(key) {
      return `camera-${key.replace(/[^a-zA-Z0-9_-]/g, '_')}`;
    }
    function setText(card, field, value) {
      const node = card.querySelector(`[data-field="${field}"]`);
      if (node) node.textContent = value;
    }
    function ensureCard(c) {
      const cards = document.getElementById('cards');
      const id = cardId(c.camera_key);
      let card = document.getElementById(id);
      if (card) return card;

      card = document.createElement('article');
      card.className = 'card';
      card.id = id;
      card.innerHTML = `
        <div data-field="pills"></div>
        <div class="key" data-field="camera_key"></div>
        <div class="meta" data-field="segment_dir"></div>
        <div class="preview">
          <div class="view" data-title="RGB">
            <img alt="RGB preview" data-preview="rgb" style="display:none">
            <span data-placeholder="rgb">等待 RGB 关键帧</span>
          </div>
          <div class="view" data-title="Depth 伪彩">
            <img alt="Depth preview" data-preview="depth" style="display:none">
            <span data-placeholder="depth">等待 Depth 预览帧</span>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><div class="label">RGB packets</div><div class="value" data-field="rgb_packets"></div></div>
          <div class="stat"><div class="label">Depth packets</div><div class="value" data-field="depth_packets"></div></div>
          <div class="stat"><div class="label">RGB bytes</div><div class="value" data-field="rgb_bytes"></div></div>
          <div class="stat"><div class="label">Depth bytes</div><div class="value" data-field="depth_bytes"></div></div>
          <div class="stat"><div class="label">RGB preview</div><div class="value" data-field="rgb_preview"></div></div>
          <div class="stat"><div class="label">Depth preview</div><div class="value" data-field="depth_preview"></div></div>
          <div class="stat"><div class="label">Last media us</div><div class="value" data-field="last_media_us"></div></div>
        </div>
        <p class="meta" data-field="last_error"></p>
        <button data-action="start">单路开始</button>
        <button class="stop" data-action="stop">单路停止</button>`;
      card.querySelector('[data-action="start"]').addEventListener('click', () => {
        postCamera('/api/record/start', card.dataset.senderId, card.dataset.cameraId);
      });
      card.querySelector('[data-action="stop"]').addEventListener('click', () => {
        postCamera('/api/record/stop', card.dataset.senderId, card.dataset.cameraId);
      });
      cards.appendChild(card);
      return card;
    }
    function setPills(card, c) {
      const pills = card.querySelector('[data-field="pills"]');
      const rgbWarn = c.rgb_packets > 0 && c.rgb_bytes / c.rgb_packets < 1000
        ? '<span class="pill warn">RGB HEADER ONLY</span>' : '';
      pills.innerHTML = `
        <span class="pill ${c.online ? 'ok' : 'off'}">${c.online ? 'ONLINE' : 'OFFLINE'}</span>
        <span class="pill ${c.recording ? 'ok' : 'off'}">${c.recording ? 'RECORDING' : 'IDLE'}</span>
        ${rgbWarn}`;
    }
    function refreshPreview(card, kind, available, url) {
      const img = card.querySelector(`[data-preview="${kind}"]`);
      const placeholder = card.querySelector(`[data-placeholder="${kind}"]`);
      if (!available) {
        if (!img.src) {
          img.style.display = 'none';
          placeholder.style.display = '';
        }
        return;
      }
      if (card.dataset[`${kind}Loading`] === '1') return;

      const next = new Image();
      card.dataset[`${kind}Loading`] = '1';
      next.onload = () => {
        img.src = next.src;
        img.style.display = 'block';
        placeholder.style.display = 'none';
        card.dataset[`${kind}Loading`] = '0';
      };
      next.onerror = () => {
        card.dataset[`${kind}Loading`] = '0';
      };
      next.src = url;
    }
    function updateCard(c) {
      const card = ensureCard(c);
      card.dataset.senderId = c.sender_id;
      card.dataset.cameraId = c.camera_id;
      card.dataset.rgbAvailable = c.rgb_preview_available ? '1' : '0';
      card.dataset.depthAvailable = c.depth_preview_available ? '1' : '0';
      setPills(card, c);
      setText(card, 'camera_key', c.camera_key);
      setText(card, 'segment_dir', c.segment_dir || '未开启切片');
      setText(card, 'rgb_packets', c.rgb_packets);
      setText(card, 'depth_packets', c.depth_packets);
      setText(card, 'rgb_bytes', fmtBytes(c.rgb_bytes));
      setText(card, 'depth_bytes', fmtBytes(c.depth_bytes));
      setText(card, 'rgb_preview', `${c.rgb_preview_width || 0}x${c.rgb_preview_height || 0}`);
      setText(card, 'depth_preview', `${c.depth_preview_width || 0}x${c.depth_preview_height || 0}`);
      setText(card, 'last_media_us', c.last_media_us);
      setText(card, 'last_error', c.last_error || '');

      refreshCardPreviews(card);
    }
    function previewUrl(card, kind) {
      return `/api/preview/${kind}?sender_id=${encodeURIComponent(card.dataset.senderId)}&camera_id=${encodeURIComponent(card.dataset.cameraId)}&t=${Date.now()}`;
    }
    function refreshCardPreviews(card) {
      if (!card.dataset.senderId || !card.dataset.cameraId) return;
      refreshPreview(card, 'rgb', card.dataset.rgbAvailable === '1', previewUrl(card, 'rgb'));
      refreshPreview(card, 'depth', card.dataset.depthAvailable === '1', previewUrl(card, 'depth'));
    }
    function refreshAllPreviews() {
      document.querySelectorAll('.card[id^="camera-"]').forEach(refreshCardPreviews);
    }
    async function load() {
      const res = await fetch('/api/status');
      const data = await res.json();
      document.getElementById('summary').textContent = `NAS: ${data.nas_root} | cameras: ${data.cameras.length} | all recording: ${data.recording_all}`;
      document.getElementById('system').innerHTML = `
        <div><b>媒体端口</b><div class="meta">TCP ${data.media_port}</div></div>
        <div><b>状态端口</b><div class="meta">UDP ${data.status_port}</div></div>
        <div><b>管理端口</b><div class="meta">HTTP ${data.admin_port}</div></div>
        <div><b>NAS</b><div class="meta">${data.nas_root}</div></div>`;
      const cards = document.getElementById('cards');
      cards.querySelector('[data-empty="true"]')?.remove();
      const seen = new Set(data.cameras.map((c) => cardId(c.camera_key)));
      for (const card of [...cards.querySelectorAll('.card[id^="camera-"]')]) {
        if (!seen.has(card.id)) card.remove();
      }
      if (data.cameras.length) {
        data.cameras.forEach(updateCard);
      } else if (!cards.querySelector('[data-empty="true"]')) {
        cards.innerHTML = '<article class="card" data-empty="true"><div class="key">暂无摄像头</div><pre>等待发送端 sender_hello / camera_announce / 媒体帧。</pre></article>';
      }
    }
    load();
    setInterval(load, 1000);
    setInterval(refreshAllPreviews, 200);
  </script>
</body>
</html>
